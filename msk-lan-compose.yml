version: "3.7"
services:
  # Server 1
  MskLanSrv1:
    image: ghcr.io/melkortf/tf2-competitive
    restart: always
    environment:
      - SERVER_HOSTNAME=MoscowLAN Server 1
      - STV_NAME=MoscowLAN SourceTV 1
      - PORT=27015
      - CLIENT_PORT=27016
      - STEAM_PORT=27018
      - STV_PORT=27020
      - RCON_PASSWORD=dsadsadsadsadsada
      - DEMOS_TF_APIKEY=
      - LOGS_TF_APIKEY=
      - TICKRATE=200
    command: "+sv_pure 2 +map cp_badlands +maxplayers 12 +sv_lan 1"
    volumes:
      - ./entrypoint.sh:/home/tf2/server/entrypoint.sh:ro
    network_mode: host

  # Server 2
  MskLanSrv2:
