services:
  tf2:
    image: spiretf/docker-spire-server
    container_name: tf2-test
    ports:
      - "27015:27015/tcp"
      - "27015:27015/udp"
    environment:
      RCON_PASSWORD: test
      PASSWORD: test
      MAP: cp_badlands
      NAME: test
    # Restart only while you are actively testing.
    restart: unless-stopped
